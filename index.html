<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Little Lagoon · Preview</title><style>*{box-sizing:border-box}body{margin:0;background:#344d41;color:#f5efd9;font:14px system-ui,sans-serif}header{height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;gap:14px}strong{font:16px Georgia,serif}nav{display:flex;gap:5px}button{padding:5px 14px;border:1px solid #718a77;border-radius:9px;background:transparent;color:inherit;cursor:pointer;font:13px system-ui}button[aria-pressed=true]{background:#f0e5c7;color:#294d44;border-color:#f0e5c7}button:focus-visible{outline:3px solid #edc57e;outline-offset:2px}small{color:#bed0be}iframe{display:block;width:100%;height:calc(100dvh - 40px);border:0;background:#83c7cc}@media(max-width:560px){header{padding:0 10px}strong{font-size:17px}small{display:none}button{padding:8px 11px}}</style></head><body><header><strong>Little Lagoon</strong><nav aria-label="Preview sections"><button data-page="Play.html" aria-pressed="true">Island</button><button data-page="Character.html" aria-pressed="false">Character</button></nav><small>Your island, your pace</small></header><iframe id="preview" title="Little Lagoon island game" src="Play.html" allow="fullscreen"></iframe><script>const frame=document.querySelector('#preview');const buttons=[...document.querySelectorAll('[data-page]')];function show(page){const button=buttons.find(b=>b.dataset.page===page)||buttons[0];buttons.forEach(b=>b.setAttribute('aria-pressed',String(b===button)));if(frame.getAttribute('src')!==button.dataset.page)frame.src=button.dataset.page;frame.title=button.textContent==='Island'?'Little Lagoon island game':'Little Lagoon character viewer';history.replaceState(null,'',button.textContent==='Character'?'#character':'#island');}buttons.forEach(b=>b.onclick=()=>show(b.dataset.page));if(location.hash==='#character')show('Character.html');</script></body></html>
